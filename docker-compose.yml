# Local PostgreSQL database for development.
# Usage: copy .env.example to .env, set your own values and run: docker compose up -d
services:
  loadmatch-db:
    image: postgres:16
    container_name: loadmatch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - loadmatch-db-data:/var/lib/postgresql/data

volumes:
  loadmatch-db-data:
