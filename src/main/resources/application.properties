# Spring Application Name
spring.application.name=LoadMatch Platform

# Server Configuration (Azure App Service injects PORT; defaults to 8080 locally)
server.port=${PORT:8080}

# Spring DataSource Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/loadmatch
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Spring Data JPA Configuration
spring.jpa.show-sql=false

# Spring Data JPA Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Create one PostgreSQL schema per bounded context (iam, profiles, fleet, ...), as defined in section 4.8 of the report
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true
