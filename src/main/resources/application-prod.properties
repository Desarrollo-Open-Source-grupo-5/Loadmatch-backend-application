# Production profile
# Read database settings from environment variables expected in Docker/runtime (Azure App Service).
spring.datasource.url=jdbc:postgresql://${DATABASE_URL}:${DATABASE_PORT:5432}/${DATABASE_NAME}?sslmode=require
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}

# Production-lean JPA behavior
# Azure Database for PostgreSQL starts empty, so Hibernate creates and updates the tables on deployment.
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# App port (Azure App Service injects PORT)
server.port=${PORT:8080}

# Demo users are created only when LOADMATCH_SEED_ENABLED=true is set in the hosting provider.
loadmatch.seed.enabled=${LOADMATCH_SEED_ENABLED:false}
loadmatch.seed.password=${LOADMATCH_SEED_PASSWORD:Loadmatch123}
